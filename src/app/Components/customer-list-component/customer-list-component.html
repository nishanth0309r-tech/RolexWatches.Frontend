<h2>Customers</h2>
<table>
  <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Action</th></tr></thead>
  <tbody>
    <tr *ngFor="let c of customers">
      <td>{{ c.fullName }}</td>
      <td>{{ c.email }}</td>
      <td>{{ c.isActive ? 'Active' : 'Blocked' }}</td>
      <td><button (click)="toggleBlock(c)">{{ c.isActive ? 'Block' : 'Unblock' }}</button></td>
    </tr>
  </tbody>
</table>
