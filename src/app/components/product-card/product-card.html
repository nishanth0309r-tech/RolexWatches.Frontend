<div class="card h-100 shadow-sm tilt-card" [style]="tiltStyle">
  <a [routerLink]="['/product', product.id]">
    <img
      [src]="product.imageUrl || 'https://placehold.co/300x300?text=No+Image'"
      class="card-img-top"
      [alt]="product.name"
      style="height: 200px; object-fit: cover;"
      (error)="$any($event.target).src='https://placehold.co/300x300?text=No+Image'"
    >
  </a>
  <div class="card-body d-flex flex-column">
    <h6 class="card-title">{{ product.name }}</h6>
    <p class="card-text fw-bold">
      <span *ngIf="product.discountPrice" class="text-danger">${{ product.discountPrice }}</span>
      <span [class.text-decoration-line-through]="product.discountPrice" [class.text-muted]="product.discountPrice">
        ${{ product.price }}
      </span>
    </p>
    <div class="mt-auto d-flex gap-2">
      <button class="btn btn-primary btn-sm flex-grow-1 btn-pulse" (click)="addToCart()">Add to Cart</button>
      <button class="btn btn-outline-danger btn-sm" (click)="addToWishlist()">
        <i class="bi bi-heart"></i>
      </button>
    </div>
  </div>
</div>
