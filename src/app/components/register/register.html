<div class="container py-5" style="max-width: 400px;">
  <h2 class="mb-4 text-center">Create Account</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" [(ngModel)]="details.fullName" name="fullName" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" [(ngModel)]="details.email" name="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Phone Number</label>
      <input type="text" class="form-control" [(ngModel)]="details.phoneNumber" name="phoneNumber">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" [(ngModel)]="details.password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
      {{ loading ? 'Creating account...' : 'Register' }}
    </button>
  </form>
  <p class="text-center mt-3">
    Already have an account? <a routerLink="/login">Login here</a>
  </p>
</div>
