<div class="container py-4">
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border" role="status"></div>
  </div>

  <div class="row" *ngIf="!loading && product">
    <div class="col-md-6">
      <img
        [src]="product.imageUrl || 'https://placehold.co/500x500?text=No+Image'"
        class="img-fluid rounded"
        [alt]="product.name"
        (error)="$any($event.target).src='https://placehold.co/500x500?text=No+Image'"
      >
    </div>
    <div class="col-md-6">
      <h2>{{ product.name }}</h2>
      <p class="fs-4 fw-bold">
        <span *ngIf="product.discountPrice" class="text-danger">${{ product.discountPrice }}</span>
        <span [class.text-decoration-line-through]="product.discountPrice" [class.text-muted]="product.discountPrice">
          ${{ product.price }}
        </span>
      </p>

      <div class="d-flex align-items-center gap-2 mb-3">
        <label>Quantity:</label>
        <input type="number" class="form-control w-25" [(ngModel)]="quantity" min="1">
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" (click)="addToCart()">Add to Cart</button>
        <button class="btn btn-outline-danger" (click)="addToWishlist()">
          <i class="bi bi-heart"></i> Wishlist
        </button>
      </div>
    </div>
  </div>

  <p *ngIf="!loading && !product" class="text-muted">Product not found.</p>
</div>
